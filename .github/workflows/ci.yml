name: CI

on:
  push:
    branches-ignore: [ci-output, asset-survey, tools/asset-survey]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

permissions:
  contents: write

jobs:
  build:
    name: Build, test and render
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
            mesa-vulkan-drivers libvulkan1 xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Each stage logs to ci-out/ and records failure instead of stopping,
      # so the publish step below always runs with complete output.
      - name: Format
        run: |
          mkdir -p ci-out
          cargo fmt --all --check > ci-out/1-fmt.log 2>&1 || echo fmt >> ci-out/FAILED

      - name: Build
        run: |
          cargo build --release --workspace --message-format=short > ci-out/2-build.log 2>&1 \
            || echo build >> ci-out/FAILED

      # Lint failures are reported but do not block the runtime checks.
      - name: Clippy
        if: hashFiles('ci-out/FAILED') == ''
        run: |
          cargo clippy --release --workspace --message-format=short -- -D warnings \
            > ci-out/3-clippy.log 2>&1 || echo clippy >> ci-out/LINT_FAILED

      - name: Unit tests
        if: hashFiles('ci-out/FAILED') == ''
        run: cargo test --release --workspace > ci-out/4-test.log 2>&1 || echo test >> ci-out/FAILED

      - name: CPU and memory smoke run
        if: hashFiles('ci-out/FAILED') == ''
        run: |
          ./target/release/little-falls --cpu-only --quick --out ci-out/results \
            > ci-out/5-cpu.log 2>&1 || echo cpu >> ci-out/FAILED

      # Renders on Mesa's software Vulkan driver (lavapipe). Frame rates
      # here mean nothing; this catches crashes and produces screenshots.
      - name: Graphics smoke run (software Vulkan)
        if: hashFiles('ci-out/FAILED') == ''
        env:
          WGPU_BACKEND: vulkan
          RUST_LOG: warn
        run: |
          timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" \
            ./target/release/little-falls --run graphics --preset high \
              --windowed 960x540 --sweep-frames 60 --duration 90 --exit-on-finish --no-motion-blur \
              --screenshots ci-out/screens --out ci-out/results \
            > ci-out/6-graphics.log 2>&1 || echo graphics >> ci-out/FAILED

      - name: Menu screenshot
        if: hashFiles('ci-out/FAILED') == ''
        env:
          WGPU_BACKEND: vulkan
        run: |
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" \
            ./target/release/little-falls --windowed 1280x720 --menu-screenshot ci-out/screens/menu.png \
            > ci-out/7-menu.log 2>&1 || echo menu >> ci-out/FAILED

      # Publishes logs, screenshots and Cargo.lock to the ci-output branch.
      - name: Publish CI output
        if: always()
        run: |
          cp Cargo.lock ci-out/ 2>/dev/null || true
          echo "${GITHUB_SHA} ${GITHUB_REF_NAME}" > ci-out/COMMIT
          cd ci-out
          git init -q -b ci-output
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-output

      - name: Upload binary
        if: hashFiles('ci-out/FAILED') == ''
        uses: actions/upload-artifact@v4
        with:
          name: little-falls-linux-x86_64
          path: target/release/little-falls

      - name: Fail if any stage failed
        run: |
          if [ -f ci-out/FAILED ] || [ -f ci-out/LINT_FAILED ]; then
            echo "Failed stages:"; cat ci-out/FAILED ci-out/LINT_FAILED 2>/dev/null; exit 1
          fi
