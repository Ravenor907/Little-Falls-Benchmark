[workspace]
resolver = "2"
members = ["crates/lf-core", "crates/lf-image", "crates/little-falls"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Ravenor907/Little-Falls-Benchmark"

# Bevy is slow in debug builds; optimize dependencies even in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
